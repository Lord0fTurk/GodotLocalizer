name: Release

# Pushing a version tag (0.1.0 or v0.1.0) builds Windows and Linux and attaches the files to the GitHub
# release of that tag. Run manually (Actions -> Release -> Run workflow) to only build the artifacts, or fill in
# "release_tag" to attach the builds to a release that already exists (for example after fixing the workflow).
on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the builds to (empty = only build artifacts)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # The tag the builds belong to: the pushed tag, or the one typed into the manual run (empty = no release).
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read the version and check the tag
        shell: bash
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/version.py').read()).group(1))")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if [ -n "${RELEASE_TAG}" ] && [ "${RELEASE_TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match src/version.py (${VERSION}); use ${VERSION} or v${VERSION}"; exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Lint and test
        run: |
          python -m ruff check .
          python -m pytest -q

      - name: Build standalone executable (runs the frozen self-check)
        run: python build.py

      - name: Start-up smoke test of the frozen program
        shell: bash
        env:
          GODOTLOCALIZER_SMOKE_TEST: "1"
        run: timeout 90 ./dist/GodotLocalizer/GodotLocalizer.exe

      - name: Package standalone ZIP
        shell: powershell
        run: |
          $ZipName = "GodotLocalizer-${env:VERSION}-windows-x64.zip"
          Compress-Archive -Path "dist\GodotLocalizer\*" -DestinationPath $ZipName -CompressionLevel Optimal
          echo "ZIP_PATH=$ZipName" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodotLocalizer-windows-x64
          path: ${{ env.ZIP_PATH }}

      - name: Attach to GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ZIP_PATH }}

  build-linux:
    # Experimental. Built on an older Ubuntu so the binary runs on current distributions and SteamOS
    # (glibc is forward-compatible only). Nothing is attached unless the frozen program passes its
    # own self-check and an offscreen start-up.
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read the version and check the tag
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/version.py').read()).group(1))")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if [ -n "${RELEASE_TAG}" ] && [ "${RELEASE_TAG#v}" != "${VERSION}" ]; then
            echo "Tag ${RELEASE_TAG} does not match src/version.py (${VERSION}); use ${VERSION} or v${VERSION}"; exit 1
          fi

      - name: System libraries for Qt and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            fonts-dejavu-core fonts-liberation fontconfig

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone executable (runs the frozen self-check)
        run: python build.py

      - name: Start-up smoke test of the frozen program
        env:
          GODOTLOCALIZER_SMOKE_TEST: "1"
        run: timeout 90 ./dist/GodotLocalizer/GodotLocalizer

      - name: Package tar.gz (keeps the executable bit)
        run: |
          TAR_NAME="GodotLocalizer-${VERSION}-linux-x64.tar.gz"
          tar -czf "$TAR_NAME" -C dist GodotLocalizer
          echo "TAR_PATH=$TAR_NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodotLocalizer-linux-x64
          path: ${{ env.TAR_PATH }}

      - name: Attach to GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.TAR_PATH }}
